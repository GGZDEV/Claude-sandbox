<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FootNews — Actualités football fiables</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⚽</span>
        <span class="logo-text">FootNews</span>
        <span class="logo-sub">Agrégateur fiable</span>
      </div>
      <div class="header-actions">
        <button id="btn-refresh" class="btn btn-ghost" title="Rafraîchir les flux">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span>Rafraîchir</span>
        </button>
        <button id="btn-sources" class="btn btn-ghost" title="Gérer les sources">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>Sources</span>
        </button>
      </div>
    </div>
    <div id="stats-bar" class="stats-bar"></div>
  </header>

  <!-- FILTERS -->
  <div class="filters-wrapper">
    <div class="filters-inner">

      <div class="filter-group">
        <label>Recherche</label>
        <input type="search" id="filter-search" placeholder="Joueur, club, transfert…" />
      </div>

      <div class="filter-group">
        <label>Score min.</label>
        <div class="score-filter">
          <input type="range" id="filter-score" min="1" max="5" step="0.5" value="1" />
          <span id="filter-score-val">1</span>
        </div>
      </div>

      <div class="filter-group">
        <label>Anti-putaclick</label>
        <div class="score-filter">
          <input type="range" id="filter-clickbait" min="0" max="1" step="0.1" value="1" />
          <span id="filter-clickbait-val">max</span>
        </div>
      </div>

      <div class="filter-group">
        <label>Pays</label>
        <select id="filter-country">
          <option value="">Tous</option>
          <option value="FR">🇫🇷 France</option>
          <option value="ES">🇪🇸 Espagne</option>
          <option value="IT">🇮🇹 Italie</option>
          <option value="DE">🇩🇪 Allemagne</option>
          <option value="GB">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Angleterre</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Type de source</label>
        <select id="filter-type">
          <option value="">Tous</option>
          <option value="newspaper">Journaux</option>
          <option value="journalist">Journalistes</option>
          <option value="website">Sites web</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Trier par</label>
        <select id="filter-sort">
          <option value="date">Date</option>
          <option value="score">Fiabilité</option>
        </select>
      </div>

      <button id="btn-reset-filters" class="btn btn-ghost btn-sm">Réinitialiser</button>
    </div>

    <!-- Active tag filters -->
    <div id="active-tags" class="active-tags"></div>
  </div>

  <!-- MAIN CONTENT -->
  <main>
    <div id="feed" class="feed"></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <!-- SOURCES PANEL (slide-in) -->
  <div id="sources-overlay" class="overlay hidden"></div>
  <aside id="sources-panel" class="sources-panel hidden">
    <div class="panel-header">
      <h2>Sources</h2>
      <button id="btn-close-sources" class="btn-icon">✕</button>
    </div>
    <div id="sources-list" class="sources-list"></div>
  </aside>

  <!-- LOADING -->
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
